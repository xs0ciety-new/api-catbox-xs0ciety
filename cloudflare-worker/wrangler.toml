name = "xs0ciety-upload-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# Route: pasang di subdomain/path domain Anda
routes = [
  { pattern = "xs0cietylabsz.biz.id/api/upload", zone_name = "xs0cietylabsz.biz.id" }
]

[vars]
ALLOWED_ORIGINS = "https://xs0cietylabsz.biz.id,https://www.xs0cietylabsz.biz.id,https://USERNAME.github.io"
VERCEL_API_URL = "https://your-project.vercel.app/api/upload"

# Secret (JANGAN taruh di sini — pakai `wrangler secret put`)
# INTERNAL_SECRET → wrangler secret put INTERNAL_SECRET
# TURNSTILE_SECRET → wrangler secret put TURNSTILE_SECRET
